<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="boxGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />

  <!-- Inner Subtle Border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#334155" stroke-width="4" opacity="0.4" />

  <!-- Central Package Box Icon -->
  <g filter="url(#shadow)" transform="translate(106, 106)">
    <!-- Main Box Body -->
    <path d="M150 20 L270 85 L270 230 L150 295 L30 230 L30 85 Z" fill="#D97706" />
    <!-- Top Left Flap -->
    <path d="M150 20 L270 85 L150 150 L30 85 Z" fill="#F59E0B" />
    <!-- Center Dividing Tape -->
    <path d="M150 20 L150 150" stroke="#78350F" stroke-width="10" stroke-linecap="round" />
    <path d="M150 150 L150 295" stroke="#92400E" stroke-width="10" stroke-linecap="round" />
    <!-- Right Shading -->
    <path d="M150 150 L270 85 L270 230 L150 295 Z" fill="#B45309" opacity="0.3" />
    <!-- Left Shading -->
    <path d="M150 150 L30 85 L30 230 L150 295 Z" fill="#FBBF24" opacity="0.15" />
    <!-- Front Clock/Timer Emblem -->
    <circle cx="150" cy="220" r="36" fill="#1E293B" stroke="#F59E0B" stroke-width="6" />
    <circle cx="150" cy="220" r="4" fill="#F59E0B" />
    <!-- Clock Hands (Showing 5 min to deadline) -->
    <line x1="150" y1="220" x2="150" y2="198" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
    <line x1="150" y1="220" x2="168" y2="220" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />
  </g>
</svg>
