version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: expirybox-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/expirybox
      - JWT_SECRET=production_expirybox_super_secret_jwt_2026
      - NODE_ENV=production
    volumes:
      - uploads_data:/app/server/uploads
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: expirybox-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
  uploads_data:
